title: Vardara Software
description: > 
  Premier Ruby on Rails development, AWS cloud deployment, and AI automation company helping businesses build and scale.
baseurl: "/"
url: https://vardarasoftware.com

# Wordmark — flip wordmark_accent to "Lab" in one edit when the rename is approved
wordmark_lead: "Vardara"
wordmark_accent: "Software"

# Booking status — single config value, edit here when availability changes
booking:
  label: "Currently booking"
  value: "Q1 2027 — 2 squads open"

# Contact page — submission endpoint.
# Leave endpoint empty for demo mode (validates client-side, nothing is transmitted).
# Set to a real POST URL (Formspree, n8n webhook, or a new Zoho project-enquiry form) to go live.
# IMPORTANT: Do NOT reuse the LinkedIn/recruiting Zoho form tokens (webform922561000000459009).
# Deciding the real destination is a board decision — see VAR-11.
contact:
  endpoint: ""
  response_times:
    initial_read: "Within 1 business day"
    call_schedule: "Your calendar, your timezone"
    shaping_note: "Within 3 working days"
    weekly_cadence: "Weekly from there"

permalink: "/blog/:title/"

plugins:
  - jekyll-feed
  - jekyll-soopr-seo-tag
  - jekyll-sitemap
  - jekyll-minifier

css_dir: "assets/css"

highlighter: rouge

collections:
  posts:
    output: true
    permalink: "/blog/:title"
  pages:
    output: true
    permalink: "/:title"

jekyll-minifier:
  uglifier_args:
    harmony: true

soopr:
  publish_token: ""

twitter:
  card: summary_large_image

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - postcss.config.js
  - purgecss.config.js
  - tailwind.config.js
  - .gitignore
  - vendor
  - .npm/